<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar App Wallet Sears</title>
</head>
<body>
  <p>Redirigiendo a la tienda correspondiente...</p>
  <!-- Enlaces manuales por si la redirección no ocurre -->
  <p>
    <a href="https://apps.apple.com/mx/app/wallet-sears/id6737367809">App Store</a> |
    <a href="https://play.google.com/store/apps/details?id=com.evertec.wallet.sears">Google Play</a>
  </p>

  <script>
    (function() {
      const iosLink = "https://apps.apple.com/mx/app/wallet-sears/id6737367809";
      const androidLink = "https://play.google.com/store/apps/details?id=com.evertec.wallet.sears";

      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /android/i.test(ua);

      if (isIOS) {
        window.location.replace(iosLink);
      } else if (isAndroid) {
        window.location.replace(androidLink);
      }
      // Si no es ninguno, se muestran los enlaces manuales que ya están en el body.
    })();
  </script>
</body>
</html>
