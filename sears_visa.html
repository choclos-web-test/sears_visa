<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar App Wallet Sears</title>
</head>
<body>
  <p>Redirigiendo a la tienda correspondiente...</p>
  <p>
    <a href="https://apps.apple.com/mx/app/wallet-sears/id6737367809">App Store</a> |
    <a href="https://play.google.com/store/apps/details?id=com.evertec.wallet.sears">Google Play</a>
  </p>

  <script>
    (function () {
      var IOS_LINK = "https://apps.apple.com/mx/app/wallet-sears/id6737367809";
      var ANDROID_LINK = "https://play.google.com/store/apps/details?id=com.evertec.wallet.sears";

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      function goTo(url) {
        // Intentar afectar la ventana superior (útil en WebViews / iframes)
        try {
          if (window.top && window.top !== window) {
            window.top.location.href = url;
          } else {
            window.location.href = url;
          }
        } catch (e) {
          // Fallback si hay restricciones cross-origin
          window.location.href = url;
        }
      }

      // Pequeño delay para que Safari procese el evento
      if (isIOS) {
        setTimeout(function () { goTo(IOS_LINK); }, 50);
      } else if (isAndroid) {
        setTimeout(function () { goTo(ANDROID_LINK); }, 50);
      }
    })();
  </script>
</body>
</html>
