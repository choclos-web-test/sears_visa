<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar App Wallet Sears</title>
  
  <!-- 1. Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F5HDR051LC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F5HDR051LC', {
      'page_title': 'Landing Descarga Wallet Sears',
      'page_location': window.location.href 
    });
  </script>
</head>
<body>
  <p>Redirigiendo a la tienda correspondiente...</p>
  <p>
    <!-- 2. Enlaces con rastreo de clics manuales (para PC o si falla el auto-redirect) -->
    <a href="https://apps.apple.com/mx/app/wallet-sears/id6737367809" 
       onclick="gtag('event', 'clic_manual', {'event_category': 'descarga', 'event_label': 'App Store'});"
       target="_blank" rel="noopener noreferrer">App Store</a> |
       
    <a href="https://play.google.com/store/apps/details?id=com.evertec.wallet.sears" 
       onclick="gtag('event', 'clic_manual', {'event_category': 'descarga', 'event_label': 'Google Play'});"
       target="_blank" rel="noopener noreferrer">Google Play</a>
  </p>

  <!-- 3. Script de redirección automática por dispositivo -->
  <script>
    (function () {
      var IOS_LINK = "https://apps.apple.com/mx/app/wallet-sears/id6737367809";
      var ANDROID_LINK = "https://play.google.com/store/apps/details?id=com.evertec.wallet.sears";

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      function goTo(url, deviceType) {
        // Registrar el evento antes de salir
        if (typeof gtag !== 'undefined') {
          gtag('event', 'redireccion_automatica', {
            'event_category': 'navegacion',
            'event_label': deviceType
          });
        }
        
        try {
          if (window.top && window.top !== window) {
            window.top.location.href = url;
          } else {
            window.location.href = url;
          }
        } catch (e) {
          window.location.href = url;
        }
      }

      // Delay de 150ms para asegurar que GA4 registre la visita
      if (isIOS) {
        setTimeout(function () { goTo(IOS_LINK, 'iOS'); }, 150);
      } else if (isAndroid) {
        setTimeout(function () { goTo(ANDROID_LINK, 'Android'); }, 150);
      }
    })();
  </script>
</body>
</html>
