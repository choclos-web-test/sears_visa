<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar App Wallet Sears</title>
  
  <!-- 1. Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F5HDR051LC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F5HDR051LC', {
      'page_title': 'Landing Link Inteligente Wallet Sears',
      'page_location': window.location.href
    });
  </script>
</head>
<body>
  <h2 style="text-align: center; font-family: sans-serif;">Descargar App Wallet Sears</h2>
  <p id="status" style="text-align: center; font-family: sans-serif; color: #555;">Analizando tu dispositivo...</p>
  
  <div style="text-align: center; margin-top: 30px;">
    <p>Si la descarga no inicia automáticamente, selecciona tu tienda:</p>
    
    <a href="https://apps.apple.com/mx/app/wallet-sears/id6737367809" 
       onclick="registrarClicManual('App Store');"
       style="display: inline-block; padding: 12px 24px; background-color: #007aff; color: white; text-decoration: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; margin: 5px;"
       target="_blank" rel="noopener noreferrer">📱 Descargar en App Store</a>
       
    <br>
    
    <a href="https://play.google.com/store/apps/details?id=com.evertec.wallet.sears" 
       onclick="registrarClicManual('Google Play');"
       style="display: inline-block; padding: 12px 24px; background-color: #34a853; color: white; text-decoration: none; border-radius: 8px; font-family: sans-serif; font-weight: bold; margin: 5px;"
       target="_blank" rel="noopener noreferrer">🤖 Descargar en Google Play</a>
  </div>

  <!-- 2. Lógica del Link Inteligente + Extracción de UTM -->
  <script>
    // Función para extraer los parámetros UTM de la URL
    function obtenerUTMs() {
      const params = new URLSearchParams(window.location.search);
      return {
        utm_source: params.get('utm_source') || '(directo)',
        utm_medium: params.get('utm_medium') || '(ninguno)',
        utm_campaign: params.get('utm_campaign') || '(no establecida)',
        utm_content: params.get('utm_content') || '(no establecido)',
        utm_term: params.get('utm_term') || '(no establecido)'
      };
    }

    const utms = obtenerUTMs();

    // Función para registrar clics manuales (PC o fallback)
    function registrarClicManual(tienda) {
      if (typeof gtag !== 'undefined') {
        gtag('event', 'clic_manual', {
          'event_category': 'descarga',
          'event_label': tienda,
          'utm_source': utms.utm_source,
          'utm_campaign': utms.utm_campaign,
          'utm_content': utms.utm_content,
          'transport_type': 'beacon'
        });
      }
    }

    // Lógica de redirección automática
    (function () {
      var IOS_LINK = "https://apps.apple.com/mx/app/wallet-sears/id6737367809";
      var ANDROID_LINK = "https://play.google.com/store/apps/details?id=com.evertec.wallet.sears";

      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      function goTo(url, deviceType) {
        if (typeof gtag !== 'undefined') {
          gtag('event', 'redireccion_automatica', {
            'event_category': 'link_inteligente',
            'event_label': deviceType,
            'utm_source': utms.utm_source,
            'utm_campaign': utms.utm_campaign,
            'utm_content': utms.utm_content,
            'transport_type': 'beacon'
          });
        }
        
        document.getElementById('status').innerText = "✅ Dispositivo " + deviceType + " detectado. Redirigiendo a la tienda...";
        document.getElementById('status').style.color = "#28a745";
        document.getElementById('status').style.fontWeight = "bold";

        setTimeout(function() {
          window.location.replace(url);
        }, 400);
      }

      if (isIOS) {
        goTo(IOS_LINK, 'iOS');
      } else if (isAndroid) {
        goTo(ANDROID_LINK, 'Android');
      } else {
        document.getElementById('status').innerText = "💻 Estás en una computadora. Selecciona tu tienda preferida abajo.";
      }
    })();
  </script>
</body>
</html>
